# uinput ships a static /dev node (modules.devname), created 0600 root:root
# before the module is loaded. No uevent ever fires for it, so
# 70-macarchy-dfr.rules never gets to relax the mode -- and the daemon, which
# runs as the user, cannot open it to type F-keys. Load the module at boot so
# udev creates the node for real.
uinput
